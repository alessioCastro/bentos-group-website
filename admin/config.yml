backend:
  name: git-gateway
  branch: main

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

collections:
  - name: "content"
    label: "Site Management"
    files:

      # ==========================================
      # 1. GALLERY (Groups + Standalone Photos)
      # ==========================================
      - file: "content/gallery.json"
        label: "Photo Gallery"
        name: "gallery"
        fields:
          # --- GROUPS / CATEGORIES ---
          - label: "Photo Groups (Categories)"
            name: "groups"
            widget: "list"
            summary: "Group: {{fields.group_name}}"
            fields:
              - { label: "Group Name", name: "group_name", widget: "string", hint: "E.g., Kitchen, Bathroom, Flooring, Outdoor" }
              - label: "Group Photos"
                name: "photos"
                widget: "list"
                summary: "{{fields.alt}}"
                fields:
                  - { label: "Upload Image", name: "image", widget: "image", required: false }
                  - { label: "OR Image URL", name: "image_url", widget: "string", required: false }
                  - { label: "Alt Text (SEO)", name: "alt", widget: "string", hint: "Description for accessibility and SEO" }

          # --- STANDALONE / UNGROUPED PHOTOS ---
          - label: "General Photos (Ungrouped)"
            name: "standalone_photos"
            widget: "list"
            summary: "{{fields.alt}}"
            hint: "Photos that do not belong to any specific group"
            fields:
              - { label: "Upload Image", name: "image", widget: "image", required: false }
              - { label: "OR Image URL", name: "image_url", widget: "string", required: false }
              - { label: "Alt Text (SEO)", name: "alt", widget: "string" }

      # ==========================================
      # 2. CABINETS CATALOG (Agrupado por Série)
      # ==========================================
      - file: "content/cabinets.json"
        label: "Cabinets Catalog"
        name: "cabinets"
        fields:
          - label: "Cabinet Series"
            name: "series_list"
            widget: "list"
            summary: "Series: {{fields.series_name}}"
            fields:
              - { label: "Series Name", name: "series_name", widget: "string", hint: "Ex: Shaker Series" }
              
              # Lista de gabinetes dentro desta série
              - label: "Cabinets in this Series"
                name: "cabinets"
                widget: "list"
                summary: "{{fields.name}} - ${{fields.pricePerFoot}}/ft"
                fields:
                  - { label: "Cabinet Name", name: "name", widget: "string", hint: "Ex: Shaker Jade Green" }
                  - { label: "Price Per Foot ($)", name: "pricePerFoot", widget: "number", value_type: "int" }
                  - { label: "Upload Image", name: "image", widget: "image", required: false }
                  - { label: "OR Image URL", name: "image_url", widget: "string", required: false }
                  - { label: "Alt Text (SEO)", name: "alt", widget: "string" }
